---
# In your FIRST play (e.g., the Bastion setup play)
- name: Set Global Proxy Variables
  hosts: all
  gather_facts: no
  tasks:
    - name: Define Proxy Fact
      ansible.builtin.set_fact:
        bastion_private_ip: "10.0.1.88"
        proxy_port: "3128"
      run_once: true # Ensures it runs only once

- name: Configure APT Proxy and Update
  hosts: backend, db
  become: true
  vars:
    bastion_private_ip: "10.0.1.88" 
    proxy_port: "3128"

  tasks:
    # 1. Configure APT to use the Squid Proxy on the Bastion
    - name: Set APT HTTP/HTTPS Proxy
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99proxy
        mode: '0644'
        owner: root
        group: root
        content: |
          Acquire::http::Proxy "http://{{ bastion_private_ip }}:{{ proxy_port }}";
          Acquire::https::Proxy "http://{{ bastion_private_ip }}:{{ proxy_port }}";

    # 2. Force IPv4 (Optional but recommended based on previous error)
    - name: Force APT to use IPv4
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99force-ipv4
        mode: '0644'
        owner: root
        group: root
        content: |
          Acquire::ForceIPv4 "true";

- name: Install Docker and deploy containers
  hosts: all
  become: true

  vars:
    docker_users:
      - ubuntu
    ansible_python_interpreter: /usr/bin/python3
    ansible_user: ubuntu
    bastion_private_ip: "10.0.1.88" 
    proxy_port: "3128"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
          - docker.io
          - pip
        state: present

    - name: Ensure Python is installed
      ansible.builtin.apt:
        name: python3
        state: present
        update_cache: true

    - name: Create Python virtual environment
      ansible.builtin.command:
        cmd: python3 -m venv /home/{{ ansible_user }}/.local/bin/venv
      args:
        creates: /home/{{ ansible_user }}/.local/bin/venv

    - name: Install Docker SDK for Python via Proxy
      ansible.builtin.pip:
        name: docker
        executable: /home/{{ ansible_user }}/.local/bin/venv/bin/pip
        state: present
      environment:
        HTTP_PROXY: "http://{{ bastion_private_ip }}:3128"
        HTTPS_PROXY: "http://{{ bastion_private_ip }}:3128"

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users }}"

- name: Deploy vote and result on frontend
  hosts: bastion
  become: true

  tasks:
    - name: Pull vote image
      community.docker.docker_image:
        name: pangpangmarran/voting-app:latest
        source: pull

    - name: Run vote container
      community.docker.docker_container:
        name: vote
        image: pangpangmarran/voting-app:latest
        ports:
          - "8080:80"
        env:
          REDIS_HOST: "{{ hostvars[groups['backendGroup'][0]].ansible_facts['default_ipv4']['address'] }}"
          REDIS_PORT: "6379"
        state: started
        restart_policy: always

    - name: Pull result image
      community.docker.docker_image:
        name: pangpangmarran/result-app:latest
        source: pull

    - name: Run result container
      community.docker.docker_container:
        name: result
        image: pangpangmarran/result-app:latest
        ports:
          - "8081:80"
        env:
          PG_HOST: "{{ hostvars[groups['database'][0]].ansible_facts['default_ipv4']['address'] }}"
          PG_USER: "postgres"
          PG_PASSWORD: "postgres"
          PG_NAME: "votes"
          PG_PORT: "5432"
        state: started
        restart_policy: always

- name: Configure Docker Daemon to use Squid Proxy
  hosts: backend:db
  become: true
  vars:
    bastion_private_ip: "10.0.1.88"
    proxy_port: "3128"

  tasks:
    # 1. Create the systemd drop-in directory
    - name: Create Docker systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: '0755'

    # 2. Create the proxy configuration file
    - name: Create Docker proxy override file
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker.service.d/http-proxy.conf
        mode: '0644'
        content: |
          [Service]
          Environment="HTTP_PROXY=http://{{ bastion_private_ip }}:{{ proxy_port }}"
          Environment="HTTPS_PROXY=http://{{ bastion_private_ip }}:{{ proxy_port }}"
          Environment="NO_PROXY=localhost,127.0.0.1,10.0.0.0/8"

    # 3. Reload systemd and restart Docker to apply changes
    - name: Reload systemd and restart Docker
      ansible.builtin.systemd:
        daemon_reload: yes
        name: docker
        state: restarted
        enabled: yes
        
- name: Deploy backend (redis and worker)
  hosts: backend
  become: true

  tasks:
    - name: Pull redis image
      community.docker.docker_image:
        name: redis
        source: pull

    - name: Run redis container
      community.docker.docker_container:
        name: redis
        image: redis
        ports:
          - "6379:6379"
        state: started
        restart_policy: always

    - name: Pull worker image
      community.docker.docker_image:
        name: pangpangmarran/worker-app:latest
        source: pull

    - name: Run worker container
      community.docker.docker_container:
        name: worker
        image: pangpangmarran/worker-app:latest
        env:
          REDIS_HOST: "redis"
          DB_HOST: "{{ hostvars[groups['database'][0]].ansible_facts['default_ipv4']['address'] }}"
          DB_USER: "postgres"
          DB_PASSWORD: "postgres"
          DB_NAME: "votes"
        state: started
        restart_policy: always

- name: Deploy database (postgres)
  hosts: db
  become: true

  tasks:
    - name: Pull postgres image
      community.docker.docker_image:
        name: postgres
        tag: latest
        source: pull

    - name: Run postgres container
      community.docker.docker_container:
        name: postgres
        image: postgres:latest
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres"
          POSTGRES_DB: "votes"
        state: started
        restart_policy: always
