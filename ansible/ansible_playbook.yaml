---
- name: Install Docker and deploy containers
  hosts: all
  become: true

  vars:
    docker_users:
      - ubuntu

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
          - docker.io
          - pip
        state: present

    - name: Ensure Python is installed
      ansible.builtin.apt:
        name: python3
        state: present
        update_cache: true

    - name: Create Python virtual environment
      ansible.builtin.command:
        cmd: python3 -m venv /home/{{ ansible_user }}/.local/bin/venv
      args:
        creates: /home/{{ ansible_user }}/.local/bin/venv

    - name: Install Docker SDK for Python
      ansible.builtin.pip:
        name: docker
        executable: /home/{{ ansible_user }}/.local/bin/venv/bin/pip
        state: present

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users }}"

- name: Deploy vote and result on frontend
  hosts: annaas-instance-frontend
  become: true

  tasks:
    - name: Pull vote image
      community.docker.docker_image:
        name: pangpangmarran/voting-app:latest
        source: pull

    - name: Run vote container
      community.docker.docker_container:
        name: vote
        image: pangpangmarran/voting-app:latest
        ports:
          - "80:80"
        env:
          REDIS_HOST: "{{ hostvars[groups['backend'][0]]['ansible_default_ipv4']['address'] }}"
          REDIS_PORT: "6379"
        state: started
        restart_policy: always

    - name: Pull result image
      community.docker.docker_image:
        name: pangpangmarran/result-app:latest
        source: pull

    - name: Run result container
      community.docker.docker_container:
        name: result
        image: pangpangmarran/result-app:latest
        ports:
          - "81:80"
        env:
          PG_HOST: "{{ hostvars[groups['database'][0]]['ansible_default_ipv4']['address'] }}"
          PG_USER: "postgres"
          PG_PASSWORD: "postgres"
          PG_NAME: "postgres"
          PG_PORT: "5432"
        state: started
        restart_policy: always

- name: Deploy backend (redis and worker)
  hosts: annaas-instance-backend
  become: true

  tasks:
    - name: Pull redis image
      community.docker.docker_image:
        name: redis
        source: pull

    - name: Run redis container
      community.docker.docker_container:
        name: redis
        image: redis
        ports:
          - "6379:6379"
        state: started
        restart_policy: always

    - name: Pull worker image
      community.docker.docker_image:
        name: pangpangmarran/worker-app:latest
        source: pull

    - name: Run worker container
      community.docker.docker_container:
        name: worker
        image: pangpangmarran/worker-app:latest
        env:
          REDIS_HOST: "localhost"
          DB_HOST: "{{ hostvars[groups['database'][0]]['ansible_default_ipv4']['address'] }}"
          DB_USER: "postgres"
          DB_PASSWORD: "postgres"
          DB_NAME: "postgres"
        state: started
        restart_policy: always

- name: Deploy database (postgres)
  hosts: annaas-instance-db
  become: true

  tasks:
    - name: Pull postgres image
      community.docker.docker_image:
        name: postgres
        tag: latest
        source: pull

    - name: Run postgres container
      community.docker.docker_container:
        name: postgres
        image: postgres:latest
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres"
          POSTGRES_DB: "postgres"
        state: started
        restart_policy: always
