name: CI/CD - Build, Test & Deploy to Kubernetes

on:
  push:
    branches:
      - project2

env:
  REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: eu-central-1

jobs:
  build-vote:
    name: Build Vote App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AWS CLI version
        run: aws --version

      - uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./vote
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/voting-app:latest
            ${{ secrets.DOCKER_USERNAME }}/voting-app:${{ github.sha }}

  build-result:
    name: Build Result App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./result
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/result-app:latest
            ${{ secrets.DOCKER_USERNAME }}/result-app:${{ github.sha }}

  build-worker:
    name: Build Worker App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v4
        with:
          context: ./worker
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/worker-app:latest
            ${{ secrets.DOCKER_USERNAME }}/worker-app:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    needs: [build-vote, build-result, build-worker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/project2' && github.event_name == 'push'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: eu-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v3

      - name: Configure AWS Credentials
   
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Update Kubeconfig for EKS
        run: aws eks update-kubeconfig --region eu-central-1 --name eks-annaa

      - name: Debug Environment Variables
        run: printenv | sort

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply manifests
        run: |
          kubectl apply -f voting-namespace.yaml
          kubectl apply -f voting-services.yaml
          kubectl apply -f voting-deployments.yaml

      - name: Update images
        run: |
          kubectl set image deployment/vote vote=${{ secrets.DOCKER_USERNAME }}/voting-app:${{ github.sha }} -n voting-app
          kubectl set image deployment/result result=${{ secrets.DOCKER_USERNAME }}/result-app:${{ github.sha }} -n voting-app
          kubectl set image deployment/worker worker=${{ secrets.DOCKER_USERNAME }}/worker-app:${{ github.sha }} -n voting-app

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/vote -n voting-app --timeout=5m
          kubectl rollout status deployment/result -n voting-app --timeout=5m
          kubectl rollout status deployment/worker -n voting-app --timeout=5m
